spring:
  datasource:
    url: jdbc:h2:mem:votacao_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

integracao:
  user-info:
    url: https://user-info.herokuapp.com/users
    timeout-ms: 1000
    mock-fallback-enabled: true


